name: Apsalar
description: 'Apsalar was a mobile marketing analytics and attribution company (founded
  2010, headquartered in San Francisco, backed by Battery Ventures and 500 Startups/500
  Global) that provided a mobile measurement platform (MMP) for app install attribution,
  campaign analytics, and marketing data unification. In 2017 Apsalar merged into Singular
  (singular.net); the Apsalar brand and its developer/API surface were retired as part
  of that acquisition. The apsalar.com apex domain no longer resolves to a live site
  and www.apsalar.com now redirects to Singular, so there is no active first-party API,
  OpenAPI, or developer portal to enrich. This profile is retained as an acquired-company
  lead pointing to its successor, Singular.'
